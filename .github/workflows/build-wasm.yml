name: Build All yt-dlp to Wasm via Cython

on:
  workflow_dispatch: # 手動実行用

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Cython
        run: |
          python -m pip install --upgrade pip
          pip install cython

      - name: Setup Emscripten (LLVM)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      # あなたの指定した最強の分割ダウンロード＆展開ロジック
      - name: Download yt-dlp Master Source
        run: |
          A="https://" && B="github.com/" && C="yt-dlp/" && D="yt-dlp/" && E="archive/" && F="refs/" && G="heads/" && H="master.zip"
          curl -L "$(echo "$A$B$C$D$E$F$G$H")" -o yt-dlp.zip
          unzip yt-dlp.zip
          mv yt-dlp-master yt-dlp_src

      # 巨大なパッケージをすべてC言語化するためのコアステップ
            # cythonizeをPythonAPIから呼び出し、__main__.pyにembedオプションを効かせてC化
      - name: Convert Entire yt-dlp to C via Cython
        run: |
          python -c "
          import os
          import glob
          from Cython.Build import cythonize
          from Cython.Compiler import Options

          # Cのmain関数を生成するためのオプションを強制ON
          Options.embed = 'main'

          # yt_dlp以下のすべての.pyファイルをリストアップ
          py_files = glob.glob('yt-dlp_src/yt_dlp/**/*.py', recursive=True) + glob.glob('yt-dlp_src/yt_dlp/*.py')
          
          # 重複を排除してファイルを確定
          py_files = list(set([f for f in py_files if os.path.isfile(f)]))
          print(f'Compiling {len(py_files)} files...')

          # cythonizeを実行してCソース群を生成
          # nthreads=4 で並列処理、compiler_directivesでPython3モードを指定
          cythonize(py_files, nthreads=4, compiler_directives={'language_level': '3'})
          "
          
          # emccでビルドしやすいように生成されたCファイルを1箇所（c_output）に集約する
          mkdir c_output
          find yt-dlp_src/yt_dlp/ -name "*.c" -exec mv {} c_output/ \;


      # 生成されたすべてのCファイルをEmscriptenでWasmへビルド
      - name: Compile C to Wasm (emcc)
        run: |
          # 拡張されたCファイル群とインクルードパス（Python.hの代わりとなるEmscriptenの環境）を指定してコンパイル
          emcc c_output/yt_dlp_all.c \
            -O3 \
            -I/usr/include/python3.11 \
            -s WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_FUNCTIONS="['_main']" \
            -s EXPORTED_RUNTIME_METHODS="['ccall', 'cwrap']" \
            -o yt-dlp.js

      - name: Upload Wasm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-wasm-dist
          path: |
            yt-dlp.js
            yt-dlp.wasm
